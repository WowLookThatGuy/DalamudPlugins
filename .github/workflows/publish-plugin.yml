name: Publish plugin

# Reusable workflow called from a plugin's own repository when a release there is published.
# It copies the release's zip into a release in this repository and upserts the plugin's entry in repo.json.
on:
  workflow_call:
    inputs:
      internal-name:
        description: Plugin InternalName (the DLL/manifest name inside the zip)
        required: true
        type: string
      release-tag:
        description: Tag of the published release in the calling repository
        required: true
        type: string
      icon-url:
        description: Optional icon URL shown in the plugin installer
        required: false
        type: string
        default: ''
    secrets:
      PLUGIN_REPO_TOKEN:
        description: Token with Contents read/write on WowLookThatGuy/DalamudPlugins
        required: true

concurrency:
  group: dalamud-plugins-publish
  cancel-in-progress: false

env:
  PLUGIN_REPO: WowLookThatGuy/DalamudPlugins
  INTERNAL_NAME: ${{ inputs.internal-name }}
  SOURCE_TAG: ${{ inputs.release-tag }}
  ICON_URL: ${{ inputs.icon-url }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release zip from the plugin repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir dist
          count=$(ls dist/*.zip | wc -l)
          if [ "$count" -ne 1 ]; then echo "::error::Expected exactly one .zip on release $SOURCE_TAG, found $count"; exit 1; fi
          mv dist/*.zip "dist/$INTERNAL_NAME.zip"

      - name: Read the plugin manifest
        id: manifest
        run: |
          if ! unzip -p "dist/$INTERNAL_NAME.zip" "$INTERNAL_NAME.json" > manifest.json || [ ! -s manifest.json ]; then
            echo "::error::$INTERNAL_NAME.json not found in the zip. Is internal-name correct?"; exit 1
          fi
          sed -i '1s/^\xEF\xBB\xBF//' manifest.json  # strip a UTF-8 BOM if present
          version=$(jq -r '.AssemblyVersion' manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then echo "::error::Manifest has no AssemblyVersion"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$INTERNAL_NAME-v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: plugin-repo

      - name: Upload the zip to a release in this repository
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$PLUGIN_REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/$INTERNAL_NAME.zip" --repo "$PLUGIN_REPO" --clobber
          else
            gh release create "$TAG" "dist/$INTERNAL_NAME.zip" --repo "$PLUGIN_REPO" \
              --title "$INTERNAL_NAME ${{ steps.manifest.outputs.version }}" \
              --notes "Published from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$SOURCE_TAG"
          fi

      - name: Update repo.json
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          url="$GITHUB_SERVER_URL/$PLUGIN_REPO/releases/download/$TAG/$INTERNAL_NAME.zip"
          cd plugin-repo
          [ -f repo.json ] || echo '[]' > repo.json
          jq --slurpfile m ../manifest.json --arg url "$url" --arg icon "$ICON_URL" --argjson now "$(date +%s)" '
            ($m[0]
              + { DownloadLinkInstall: $url, DownloadLinkUpdate: $url, DownloadLinkTesting: $url, LastUpdate: $now }
              + (if $icon != "" then { IconUrl: $icon } else {} end)) as $entry
            | map(select(.InternalName != $entry.InternalName)) + [$entry]
            | sort_by(.InternalName)' repo.json > repo.json.new
          mv repo.json.new repo.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if git diff --cached --quiet; then echo "repo.json unchanged"; exit 0; fi
          git commit -m "Publish $INTERNAL_NAME ${{ steps.manifest.outputs.version }}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "::error::Could not push repo.json"; exit 1
